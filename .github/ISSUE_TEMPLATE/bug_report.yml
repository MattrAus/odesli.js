name: Bug Report
description: File a bug report to help us improve
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Call method '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example
      description: If applicable, add a minimal code example to help reproduce the issue.
      placeholder: |
        ```js
        const Odesli = require('odesli.js');
        const odesli = new Odesli();
        // Your code here
        ```
      render: javascript

  - type: textarea
    id: error
    attributes:
      label: Error Message / Stack Trace
      description: If applicable, paste the full error message or stack trace.
      placeholder: Paste error here...
      render: shell

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using?
      options:
        - '22.x'
        - '20.x'
        - '18.x'
        - '16.x'
        - '14.x'
        - 'Other (specify below)'
    validations:
      required: true

  - type: input
    id: node-version-other
    attributes:
      label: Node.js Version (if Other)
      placeholder: e.g., 12.0.0

  - type: input
    id: package-version
    attributes:
      label: odesli.js Version
      description: What version of odesli.js are you using?
      placeholder: e.g., 1.3.9
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., API key usage, rate limiting, etc.)
      placeholder: Any additional information...

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug has not already been reported
          required: true
        - label: I have included all relevant information above
          required: true
