name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          # OIDC is automatically used when id-token: write permission is set

      - name: Upgrade npm for Trusted Publishing
        run: |
          # Trusted Publishing requires npm 11.5.1+
          npm --version
          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' "11.5.1" "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to latest version for Trusted Publishing compatibility..."
            npm install -g npm@latest
            npm --version
          fi
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Update package name for npm
        run: npm pkg set name="odesli.js"

      - name: Publish to NPM
        run: npm publish --provenance --access public
